name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported toolchain: Xcode 15, Swift 5.9 language mode.
          - name: Xcode 15.4
            runner: macos-14
            xcode: /Applications/Xcode_15.4.app
            settings: ""
          # The current toolchain, in the Swift 6 language mode with warnings as errors.
          - name: Swift 6
            runner: macos-15
            xcode: ""
            settings: SWIFT_VERSION=6 SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        if: matrix.xcode != ''
        run: sudo xcode-select -s "${{ matrix.xcode }}"
      - name: Pick an iPhone simulator
        # The newest iOS runtime the selected Xcode's SDK can run, not the newest installed.
        run: |
          xcodebuild -version
          sdk=$(xcrun --sdk iphonesimulator --show-sdk-version)
          udid=$(xcrun simctl list devices available -j | SDK="$sdk" python3 -c '
          import json, os, re, sys
          sdk = tuple(int(n) for n in os.environ["SDK"].split("."))
          runtimes = []
          for runtime, devices in json.load(sys.stdin)["devices"].items():
              m = re.search(r"\.iOS-(\d+)-(\d+)", runtime)
              if m and (int(m[1]), int(m[2])) <= sdk:
                  runtimes.append(((int(m[1]), int(m[2])), devices))
          for _, devices in sorted(runtimes, key=lambda r: r[0], reverse=True):
              for d in devices:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit()
          sys.exit("no iPhone simulator for iOS SDK %s" % os.environ["SDK"])')
          echo "SIMULATOR=$udid" >> "$GITHUB_ENV"
      - name: xcodebuild test
        run: |
          set -o pipefail
          xcodebuild test -scheme Passerby -destination "id=$SIMULATOR" \
            ${{ matrix.settings }} | tee xcodebuild.log
          ! grep -E "^/.*(warning|error):" xcodebuild.log
